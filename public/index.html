<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101326"><title>Snake Arena Online</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101326;color:white;font-family:system-ui,Arial;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:12px;left:14px;font-weight:800;text-shadow:0 2px 8px #000;pointer-events:none}.hud small{display:block;color:#9eb5d6;font-weight:500}.board{position:fixed;top:12px;right:12px;background:#101629c9;border:1px solid #52608066;border-radius:12px;padding:9px 13px;font-size:12px;min-width:130px}.board b{display:block;margin-bottom:5px}.board div{margin:3px 0;color:#d8e8ff}.boost{position:fixed;bottom:26px;right:24px;border:2px solid #ffe492;background:#ed9c28c9;color:#fff;border-radius:50%;width:88px;height:88px;font-weight:900;box-shadow:0 0 25px #f7b23466;touch-action:none}.stick{position:fixed;bottom:35px;left:30px;width:125px;height:125px;border:2px solid #ffffff44;border-radius:50%;background:#ffffff12;touch-action:none}.knob{position:absolute;left:41px;top:41px;width:40px;height:40px;border-radius:50%;background:#7ee8ffbb;box-shadow:0 0 18px #5ae9ff88}.overlay{position:fixed;inset:0;background:#080d1be8;display:flex;align-items:center;justify-content:center;padding:20px}.panel{width:min(400px,100%);text-align:center;padding:32px 24px;border:1px solid #5e7db055;border-radius:24px;background:linear-gradient(145deg,#202c4a,#11182d);box-shadow:0 20px 90px #0009}.panel h1{font-size:34px;margin:4px 0;color:#8bf3fa}.panel p{color:#c0cde2;line-height:1.5}.panel input{width:100%;border:1px solid #637a9b;background:#0e1528;color:white;padding:15px;border-radius:12px;font-size:16px;margin:14px 0}.panel button{width:100%;border:0;background:linear-gradient(90deg,#42d6ff,#8fff9e);padding:15px;border-radius:12px;color:#07152b;font-size:17px;font-weight:900}.status{font-size:12px;color:#aebdd7;margin-top:12px}.hidden{display:none!important}</style></head><body><canvas id="game"></canvas><div class="hud">🐍 SNAKE ARENA <small id="score">Pontos: 0</small><small id="online">Conectando...</small></div><div class="board" id="board"><b>🏆 Ranking</b></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="boost" id="boost">⚡<br>TURBO</button><div class="overlay" id="overlay"><div class="panel"><h1>🐍 SNAKE ARENA</h1><p>Coma luzes, cresça e domine a arena! Não bata nas outras cobras nem nas bordas.</p><input id="name" maxlength="18" placeholder="Seu apelido" value="Jogador"><button id="play">JOGAR ONLINE</button><div class="status" id="status">Use o controle esquerdo para mover e TURBO para acelerar.</div></div></div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),score=document.querySelector('#score'),online=document.querySelector('#online'),board=document.querySelector('#board'),status=document.querySelector('#status');let W=innerWidth,H=innerHeight,dpr=1,ws=null,id=null,world=3200,state={players:[],foods:[]},angle=0,boost=false,cam={x:1600,y:1600},playing=false;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function connect(){if(ws)ws.close();status.textContent='Conectando ao servidor...';let url=(location.protocol==='https:'?'wss://':'ws://')+location.host;ws=new WebSocket(url);ws.onopen=()=>ws.send(JSON.stringify({type:'join',name:document.querySelector('#name').value}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='welcome'){id=m.id;world=m.size;playing=true;overlay.classList.add('hidden')}if(m.type==='state'){state=m;online.textContent=`Online: ${m.players.length} jogador(es)`;let me=m.players.find(p=>p.id===id);if(me)score.textContent=`Pontos: ${me.score}`;board.innerHTML='<b>🏆 Ranking</b>'+m.players.slice().sort((a,b)=>b.score-a.score).slice(0,5).map((p,i)=>`<div>${i+1}. ${escapeHtml(p.name)} — ${p.score}</div>`).join('')}if(m.type==='dead'){playing=false;overlay.classList.remove('hidden');status.textContent=`Você fez ${m.score} pontos! Tente novamente.`}};ws.onerror=()=>status.textContent='Erro de conexão. Verifique se o servidor está ativo.';ws.onclose=()=>{playing=false;overlay.classList.remove('hidden');if(!status.textContent.includes('pontos'))status.textContent='Desconectado. Toque para tentar novamente.'}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#play').onclick=connect;
let stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),pointer=null;function moveStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1,mag=Math.min(len,43);knob.style.transform=`translate(${dx/len*mag}px,${dy/len*mag}px)`;if(len>8)angle=Math.atan2(dy,dx)}stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)moveStick(e)});function resetStick(){pointer=null;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);let b=document.querySelector('#boost');b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);boost=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>boost=false);addEventListener('keydown',e=>{if(e.key===' '){boost=true;e.preventDefault()}if(e.key==='ArrowUp'||e.key==='w')angle=-Math.PI/2;if(e.key==='ArrowDown'||e.key==='s')angle=Math.PI/2;if(e.key==='ArrowLeft'||e.key==='a')angle=Math.PI;if(e.key==='ArrowRight'||e.key==='d')angle=0});addEventListener('keyup',e=>{if(e.key===' ')boost=false});setInterval(()=>{if(playing&&ws?.readyState===1)ws.send(JSON.stringify({type:'move',a:angle,boost}))},50);
function render(){requestAnimationFrame(render);ctx.fillStyle='#0c1224';ctx.fillRect(0,0,W,H);let me=state.players.find(p=>p.id===id);if(me){cam.x+=(me.x-cam.x)*.2;cam.y+=(me.y-cam.y)*.2}else if(!playing){cam.x+=.2;cam.y+=.1}let scale=Math.max(.58,Math.min(1,Math.min(W,H)/660));ctx.save();ctx.translate(W/2,H/2);ctx.scale(scale,scale);ctx.translate(-cam.x,-cam.y);let x0=cam.x-W/scale/2,y0=cam.y-H/scale/2;ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;ctx.beginPath();for(let x=Math.floor(x0/80)*80;x<x0+W/scale+80;x+=80){ctx.moveTo(x,y0-80);ctx.lineTo(x,y0+H/scale+80)}for(let y=Math.floor(y0/80)*80;y<y0+H/scale+80;y+=80){ctx.moveTo(x0-80,y);ctx.lineTo(x0+W/scale+80,y)}ctx.stroke();ctx.strokeStyle='#ff527c';ctx.lineWidth=12;ctx.strokeRect(0,0,world,world);for(let f of state.foods){if(Math.abs(f.x-cam.x)>W/scale/2+25||Math.abs(f.y-cam.y)>H/scale/2+25)continue;ctx.shadowBlur=12;ctx.shadowColor=f.c;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,3.5+f.v,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;for(let p of state.players){let body=p.body;if(!body?.length)continue;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0008';ctx.lineWidth=24;ctx.beginPath();body.forEach((pt,i)=>i?ctx.lineTo(pt.x+2,pt.y+3):ctx.moveTo(pt.x+2,pt.y+3));ctx.stroke();ctx.strokeStyle=p.color;ctx.lineWidth=19;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();for(let i=body.length-1;i>=0;i--){let pt=body[i];if(i===body.length-1)ctx.moveTo(pt.x,pt.y);else ctx.lineTo(pt.x,pt.y)}ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();let dx=Math.cos(p.a),dy=Math.sin(p.a),sx=-dy,sy=dx;for(let side of [-1,1]){ctx.fillStyle='white';ctx.beginPath();ctx.arc(p.x+dx*5+sx*side*5,p.y+dy*5+sy*side*5,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111a2b';ctx.beginPath();ctx.arc(p.x+dx*7+sx*side*5,p.y+dy*7+sy*side*5,2,0,Math.PI*2);ctx.fill()}ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillStyle='white';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(p.name,p.x,p.y-26);ctx.shadowBlur=0}ctx.restore()}render();
</script></body></html>
